name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for dry-run packaging (does not publish a GitHub Release)
        required: false
        default: v0.0.0-dev
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version || 'v0.0.0-dev' }}

  publish-release:
    needs: verify-and-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified six-platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: pgpmint-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify per-platform checksums and create combined manifest
        shell: bash
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          for target in win-x64 win-arm64 linux-x64 linux-arm64 macos-arm64 macos-x64; do
            test -s "SHA256SUMS-$target.txt"
            sha256sum --check "SHA256SUMS-$target.txt"
          done
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        working-directory: ${{ runner.temp }}/release-assets
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo 'Invalid release tag' >&2
            exit 1
          fi
          args=(release create "$RELEASE_TAG" ./* --title "PGPMint $RELEASE_TAG" --generate-notes --verify-tag)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
