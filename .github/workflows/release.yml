name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for dry-run packaging (does not publish a GitHub Release)'
        required: false
        default: 'v0.0.0-dev'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: ARM64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify no emojis in tracked files
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $hits = @()
          $binaryExts = @('.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.bmp', '.exe', '.dll')
          foreach ($file in (git ls-files)) {
            if ([System.IO.Path]::GetExtension($file).ToLowerInvariant() -in $binaryExts) { continue }
            $text = Get-Content -LiteralPath $file -Raw -Encoding UTF8
            if ($text -match '[\uD83C-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]') {
              $hits += $file
            }
          }
          if ($hits.Count -gt 0) {
            Write-Error ("Emoji detected in tracked files: " + ($hits -join ', '))
            exit 1
          }

      - name: Restore (${{ matrix.platform }})
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: dotnet restore PGPMint.sln "-p:Platform=$env:BUILD_PLATFORM"

      - name: Build Solution (Release ${{ matrix.platform }})
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: dotnet build PGPMint.sln "-p:Platform=$env:BUILD_PLATFORM" -c Release --no-restore

      - name: Run Automated Tests (${{ matrix.platform }})
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: dotnet test tests\PGPMint.Tests\PGPMint.Tests.csproj "-p:Platform=$env:BUILD_PLATFORM" -c Release --no-build --filter "Category!=HardwareGpu" --verbosity normal

  package:
    name: Package (${{ matrix.rid }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            runner: windows-latest
          - rid: win-arm64
            platform: ARM64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Version Metadata
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $rawTag = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } else { $env:INPUT_VERSION }
          if ([string]::IsNullOrWhiteSpace($rawTag)) {
            $rawTag = 'v0.0.0-dev'
          }
          $rawTag = $rawTag.Trim()
          if ($rawTag -notmatch '^v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Error "Invalid version tag '$rawTag'. Expected semver tag matching vMAJOR.MINOR.PATCH[-prerelease]."
            exit 1
          }
          $pkgVer = $rawTag.Substring(1)
          $fileVer = "$($Matches[1]).0"

          "tag=$rawTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pkg_version=$pkgVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "file_version=$fileVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish Standalone Compressed Single-File Executable (${{ matrix.rid }})
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_RID: ${{ matrix.rid }}
          PKG_VERSION: ${{ steps.ver.outputs.pkg_version }}
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
        shell: pwsh
        run: |
          dotnet publish src\PGPMint.App\PGPMint.App.csproj `
            -c Release `
            "-p:Platform=$env:BUILD_PLATFORM" `
            -r $env:BUILD_RID `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -p:TrimMode=partial `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -p:AllowedReferenceRelatedFileExtensions=.none `
            "-p:Version=$env:PKG_VERSION" `
            "-p:FileVersion=$env:FILE_VERSION" `
            "-p:AssemblyVersion=$env:FILE_VERSION" `
            -o "publish\$env:BUILD_RID"

      - name: Verify Standalone Single-File Output
        env:
          BUILD_RID: ${{ matrix.rid }}
          TAG_NAME: ${{ steps.ver.outputs.tag }}
        shell: pwsh
        run: |
          $pubDir = Join-Path "publish" $env:BUILD_RID
          $exe = Join-Path $pubDir "PGPMint.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            Write-Error "Expected single-file executable not found at $exe"
            exit 1
          }

          $expectedPath = (Resolve-Path $exe).Path
          $allFiles = @(Get-ChildItem -Path $pubDir -Recurse -File)
          $unexpected = @($allFiles | Where-Object { $_.FullName -ne $expectedPath })
          if ($allFiles.Count -ne 1 -or $unexpected.Count -gt 0) {
            $names = ($unexpected | ForEach-Object { $_.FullName }) -join ', '
            Write-Error "Unexpected extra files in single-file publish output: $names"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $outName = "PGPMint-$env:TAG_NAME-$env:BUILD_RID.exe"
          $outPath = Join-Path "dist" $outName
          Copy-Item -Path $exe -Destination $outPath -Force

          $item = Get-Item $outPath
          $sizeMb = [Math]::Round($item.Length / 1MB, 2)
          $hash = (Get-FileHash -Path $outPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Built $outName ($sizeMb MB) SHA256=$hash"
          @(
            "| Artifact | Size | SHA256 |"
            "|---|---:|---|"
            "| ``$outName`` | $sizeMb MB | ``$hash`` |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Single-File Artifact (${{ matrix.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: pgpmint-${{ matrix.rid }}
          path: dist/PGPMint-*.exe
          if-no-files-found: error

  publish-release:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Packaged Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: pgpmint-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release-assets -Filter "PGPMint-*.exe" | Sort-Object Name
          if ($files.Count -eq 0) {
            Write-Error "No release executables found."
            exit 1
          }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($f.Name)"
          }
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path release-assets) "SHA256SUMS.txt"),
            (($lines -join "`n") + "`n"),
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content release-assets\SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Error "Invalid release tag '$tag'."
            exit 1
          }
          $assets = @(Get-ChildItem -Path release-assets -File | Sort-Object Name | ForEach-Object { $_.FullName })
          $ghArgs = @("release", "create", $tag) + $assets + @("--title", "PGPMint $tag", "--generate-notes", "--verify-tag")
          if ($tag -match '-') {
            $ghArgs += "--prerelease"
          }
          gh @ghArgs
