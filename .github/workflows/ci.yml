name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: ARM64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify no emojis in tracked files
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $hits = @()
          $binaryExts = @('.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.bmp', '.exe', '.dll')
          foreach ($file in (git ls-files)) {
            if ([System.IO.Path]::GetExtension($file).ToLowerInvariant() -in $binaryExts) { continue }
            $text = Get-Content -LiteralPath $file -Raw -Encoding UTF8
            if ($text -match '[\uD83C-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]') {
              $hits += $file
            }
          }
          if ($hits.Count -gt 0) {
            Write-Error ("Emoji detected in tracked files: " + ($hits -join ', '))
            exit 1
          }

      - name: Restore (${{ matrix.platform }})
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: dotnet restore PGPMint.sln "-p:Platform=$env:BUILD_PLATFORM"

      - name: Build Solution (Release ${{ matrix.platform }})
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: dotnet build PGPMint.sln "-p:Platform=$env:BUILD_PLATFORM" -c Release --no-restore

      - name: Run Automated Tests (${{ matrix.platform }})
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        shell: pwsh
        run: dotnet test tests\PGPMint.Tests\PGPMint.Tests.csproj "-p:Platform=$env:BUILD_PLATFORM" -c Release --no-build --filter "Category!=HardwareGpu" --verbosity normal
